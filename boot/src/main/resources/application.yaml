logging:
  config: classpath:log4j2.xml

link-aggregator:
  category-determination:
    strategy: ai
  ai:
    ollama.enabled: true
    enabled: true
    base-url: http://localhost:11434
    generate-model: qwen2.5:7b-instruct
    embed-model: nomic-embed-text
    prompt-injection:
      threshold: 0.88
      max-words: 300
      embed-timeout: 2s
      detection-timeout: 10s
  fraud-check:
    enabled: true
    provider: opentip
    base-url: https://opentip.kaspersky.com/api/v1
    api-key: ${OPENTIP_API_KEY:}
    fail-open: true
spring:
  application.name: link_aggregator
  autoconfigure.exclude:
    - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
    - org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#      properties:
#        spring.json.add.type.headers: false
    consumer:
      group-id: url-processor-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "ru.leonaugust.link_aggregator.domain.link"
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_SENDER_EMAIL}
    password: ${MAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          debug: true

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  datasource:
    hikari:
      autoCommit: false
    url: 'jdbc:postgresql://${postgres.host}:${postgres.port}/${postgres.dbname}?currentSchema=${postgres.schema}'
    driverClassName: 'org.postgresql.Driver'
    username: ${postgres.user}
    password: ${postgres.password}
  jpa:
    database: postgresql
    open-in-view: false
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          lob.non_contextual_creation: true
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        show_sql: false
        use_sql_comments: false
        format_sql: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  sql:
    init:
      mode: never
  mvc:
    async:
      request-timeout: 300000

server:
  servlet:
    context-path: /api/link-aggregator

postgres:
  host: localhost
  port: 5433
  dbname: link_aggregator
  schema: public
  user: postgres
  password: postgres
services:
  sonarqube:
    # Pinned for reproducibility; `sonarqube:community` (moving tag) also works.
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    mem_limit: 3072M
    mem_reservation: 2048M
    cpus: 2
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      # Local dev only: skips Elasticsearch bootstrap checks that normally require higher vm.max_map_count.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:

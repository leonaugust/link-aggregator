services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    mem_limit: 1512M
    mem_reservation: 1512M
    cpus: 1
    environment:
      POSTGRES_DB: link_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - -ctimezone=Etc/UTC
      - -clog_statement=all
      - -clog_min_messages=log
#      - -cconfig_file=/etc/postgresql/postgresql.conf
    volumes:
      - ./e2e-postgresql.conf:/etc/postgresql/postgresql.conf
      - postgres_data:/var/lib/postgresql/data
#    expose:
#      - 5432
#    networks:
#      - local
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "psql -U postgres -d link_aggregator -c 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 15s
      retries: 15
  sonarqube:
    image: sonarqube:9.9.6-community
    container_name: sonarqube
    mem_limit: 2048M
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data   # чтобы данные сохранялись
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

networks:
  local:

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: